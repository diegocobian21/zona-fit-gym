spring.application.name=zona_fit

#las credenciales NO se guardan en el repositorio: se leen de variables de entorno o de
#application-local.properties (ignorado por git, ver application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zona_fit_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Evitar que se cree el esquema de bd,de manera interna se usa hibernate es el framework de persistencia, JPA = java persistence API
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
#desactivar tomcat, tomcat es para aplicaciones web, esta es de escritorio
spring.main.web-application-type=none
